packages:
  - .

allowBuilds:
  unrs-resolver: true

confirmModulesPurge: false

# Minimum security patches; remove each override when parent ranges resolve safely.
overrides:
  "vite@>=8.3.0 <8.3.3": 8.3.3
  "undici@>=8.0.0 <8.12.2": 8.12.2
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  # Upstream v8 adopts patched minimatch; leave legacy callable v3 consumers alone.
  # Remove when all parent ranges require typescript-eslint/parser >=8.73.0.
  "typescript-eslint@>=8.0.0 <8.73.0": 8.73.0
  "@typescript-eslint/parser@>=8.0.0 <8.73.0": 8.73.0
